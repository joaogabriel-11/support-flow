name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: http://127.0.0.1:3000
      E2E_ADMIN_EMAIL: admin@supportflow.com
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_REQUESTER_EMAIL: solicitante.e2e@supportflow.com
      E2E_AGENT_EMAIL: agente.e2e@supportflow.com
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Aplicar migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Preparar dados de teste
        run: npx prisma db seed

      - name: Executar ESLint
        run: npm run lint

      - name: Executar testes automatizados
        run: npm run test:run

      - name: Gerar build
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Executar testes E2E
        run: npm run test:e2e
